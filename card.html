<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro</title>
<style>
  :root { --pv:#d23a45; --san:#4a90d9; --pe:#e0ac48; --text:#f3eff8; --muted:#a7a0b8; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); }
  body { padding:22px; }
  .card { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:10px;
          padding:16px 20px 0; background:linear-gradient(160deg,#2c2c2c 0%,#141414 55%,#050505 100%); border:2px solid #fff; border-radius:14px; overflow:hidden;
          box-shadow:0 0 22px 6px rgba(0,0,0,.85), 0 10px 34px rgba(0,0,0,.8); }
  h1 { margin:0; max-width:100%; font-family:Georgia,"Times New Roman",serif; font-size:28px; line-height:1.1; text-align:center;
       letter-spacing:.5px; overflow-wrap:anywhere; color:#fff; }
  .foto { width:160px; height:160px; flex:none; border-radius:10px; overflow:hidden; border:2px solid #fff; background:#222;
          display:flex; align-items:center; justify-content:center; font-size:64px; font-weight:700; color:#777; }
  .foto img { width:100%; height:100%; object-fit:cover; display:block; }
  .stats { width:100%; display:grid; gap:9px; }
  .stat { display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:2px 10px; }
  .stat .nome { font-size:15px; font-weight:600; color:var(--muted); }
  .stat .valor { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat .valor small { font-size:17px; font-weight:600; color:var(--muted); }
  .barra { grid-column:1 / -1; height:9px; border-radius:5px; background:#3a3a3a; overflow:hidden; }
  .barra i { display:block; height:100%; border-radius:5px; transition:width .4s ease; }
  .tempo { width:calc(100% + 40px); height:5px; background:#3a3a3a; margin-top:6px; }
  .tempo i { display:block; height:100%; background:#fff; transform-origin:left; animation:acaba 10s linear forwards; }
  @keyframes acaba { from { transform:scaleX(1); } to { transform:scaleX(0); } }
  .vazio { color:var(--muted); font-size:15px; text-align:center; margin:auto; }
</style>
</head>
<body>
  <div class="card" id="card"></div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

const KEY = "com.cris.status/data";
const MODAL_ID = "com.cris.status/card";
const ID = new URLSearchParams(location.search).get("id");
const STATS = [
  { k: "pv",  nome: "Vida",     cor: "var(--pv)" },
  { k: "san", nome: "Sanidade", cor: "var(--san)" },
  { k: "pe",  nome: "Esforço",  cor: "var(--pe)" }
];

function el(tag, props = {}, ...filhos) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  filhos.forEach(f => e.append(f));
  return e;
}

function render(lista) {
  const card = document.getElementById("card");
  const p = lista.find(x => x.id === ID);
  if (!p) {
    card.replaceChildren(el("div", { className: "vazio", textContent: "Personagem não encontrado." }));
    return;
  }

  const foto = el("div", { className: "foto" });
  if (p.imagem) foto.append(el("img", { src: p.imagem, alt: "" }));
  else foto.textContent = (p.nome || "?").trim().charAt(0).toUpperCase();

  const stats = el("div", { className: "stats" });
  STATS.forEach(s => {
    const d = p[s.k];
    const pct = d.max > 0 ? Math.max(0, Math.min(100, (d.atual / d.max) * 100)) : 0;
    const barra = el("div", { className: "barra" }, el("i"));
    barra.firstChild.style.width = pct + "%";
    barra.firstChild.style.background = s.cor;
    const valor = el("div", { className: "valor" }, String(d.atual), el("small", { textContent: " / " + d.max }));
    valor.style.color = s.cor;
    stats.append(el("div", { className: "stat" }, el("div", { className: "nome", textContent: s.nome }), valor, barra));
  });

  const tempo = el("div", { className: "tempo" }, el("i"));
  card.replaceChildren(el("h1", { textContent: p.nome }), foto, stats, tempo);
}

OBR.onReady(async () => {
  const meta = await OBR.room.getMetadata();
  render(meta[KEY]?.personagens ?? []);
  OBR.room.onMetadataChange(m => render(m[KEY]?.personagens ?? []));
  setTimeout(() => OBR.modal.close(MODAL_ID), 10000);
});
</script>
</body>
</html>
